name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      # vitest 5 (this package's test runner) requires Node >=22.12 — see
      # verifiers/typescript/README.md. The verifier itself targets Node >=20.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
